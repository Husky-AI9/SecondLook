name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - name: Engine unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser tests (screens, state, AI routing against a fake Firebase)
        run: |
          python -m pip install --quiet playwright
          npm run preview:build
          python tools/preview/tests/flows.py
        env:
          CHROME: /usr/bin/google-chrome
