name: Demo footage
# Captures material for the demo video from the real builds:
#   web:      the exported web app (same build the extension test uses)
#   android:  the APK on an emulator, with a screen recording of the keyboard walk-through
# Each job publishes its files to a throwaway branch (demo-assets-*-<run>).
on:
  push:
    branches: [demo-footage]

permissions:
  actions: read
  contents: write

concurrency:
  group: demo-footage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - name: "Build the web app (no Firebase keys, offline rules)"
        run: npx expo export -p web
      - name: Publish
        run: |
          mkdir -p /tmp/pub && cp -r dist /tmp/pub/dist && cd /tmp/pub
          git init -q -b "demo-assets-web-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f && git commit -q -m "Web build for the demo video (run ${{ github.run_number }})"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "demo-assets-web-${{ github.run_number }}"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HAS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/install
      - name: Firebase config (from a secret, never from the repo)
        if: env.HAS_JSON == 'true'
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - name: Build the APK from this commit
        run: |
          npx expo prebuild --platform android --clean
          cd android && ./gradlew assembleRelease --no-daemon
          mkdir -p ../apk && cp app/build/outputs/apk/release/*.apk ../apk/
        env:
          ANDROID_PACKAGE: com.secondlook.app
          ANDROID_ONDEVICE_OPTION: ${{ vars.ANDROID_ONDEVICE_OPTION || 'PREVIEW' }}
          APPCHECK_DEBUG_TOKEN_ANDROID: ${{ secrets.APPCHECK_DEBUG_TOKEN_ANDROID }}
      - name: Text recognition for pop-up menus
        run: sudo apt-get install -y -qq tesseract-ocr >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator and record the screen
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SL_RECORD: '1'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: python3 tools/android-e2e/run.py "$(ls apk/*.apk | head -1)" e2e-out
      - name: Results
        if: always()
        run: cat e2e-out/results.md; ls -la e2e-out
      - name: Publish
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r e2e-out /tmp/pub/android && cd /tmp/pub
          rm -f android/log-filtered-redacted.txt android/crash-buffer.txt
          git init -q -b "demo-assets-android-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f && git commit -q -m "Android emulator footage for the demo video (run ${{ github.run_number }})"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "demo-assets-android-${{ github.run_number }}"
