name: Android APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/install
      - name: Firebase config (from a secret, never from the repo)
        if: env.HAS_JSON == 'true'
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - run: npx expo prebuild --platform android --clean
        env:
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE || 'com.secondlook.app' }}
          ANDROID_ONDEVICE_OPTION: ${{ vars.ANDROID_ONDEVICE_OPTION || 'PREVIEW' }}
          APPCHECK_DEBUG_TOKEN_ANDROID: ${{ secrets.APPCHECK_DEBUG_TOKEN_ANDROID }}
      - name: Build release APK (signed with the debug keystore, for testers)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: secondlook-android
          path: android/app/build/outputs/apk/release/*.apk
