name: Android emulator test
# Builds the APK from this commit, installs it on an Android emulator and walks through the app:
# Settings, select text → SecondLook, the keyboard panel (check, counter, explain, leak guard,
# scam) and the text-selection menu. Screenshots and a redacted log are uploaded.
on:
  workflow_dispatch:
  push:
    branches: [android-emulator-test]

permissions:
  actions: read
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HAS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/install
      - name: Firebase config (from a secret, never from the repo)
        if: env.HAS_JSON == 'true'
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - name: Build the APK from this commit
        run: |
          npx expo prebuild --platform android --clean
          cd android && ./gradlew assembleRelease --no-daemon
          mkdir -p ../apk && cp app/build/outputs/apk/release/*.apk ../apk/
        env:
          ANDROID_PACKAGE: com.secondlook.app
          ANDROID_ONDEVICE_OPTION: ${{ vars.ANDROID_ONDEVICE_OPTION || 'PREVIEW' }}
          APPCHECK_DEBUG_TOKEN_ANDROID: ${{ secrets.APPCHECK_DEBUG_TOKEN_ANDROID }}
      - name: Text recognition for pop-up menus
        run: sudo apt-get install -y -qq tesseract-ocr >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator (Pixel 6, Android 14, Google APIs)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: python3 tools/android-e2e/run.py "$(ls apk/*.apk | head -1)" e2e-out
      - name: Screenshots into the log (small JPEGs)
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/android-e2e/print_shots.py e2e-out
          cat e2e-out/results.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results
          path: e2e-out
