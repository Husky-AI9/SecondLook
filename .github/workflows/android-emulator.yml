name: Android emulator test
# Installs the latest APK built on main on an Android emulator and walks through the app:
# Settings, select text → SecondLook, the keyboard panel (check, counter, explain, leak guard,
# scam) and the text-selection menu. Screenshots and a redacted log are uploaded.
on:
  workflow_dispatch:
  push:
    branches: [android-emulator-test]

permissions:
  actions: read
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Get the latest APK built on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "${{ github.repository }}" --workflow android-apk.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "APK from run $id"
          gh run download "$id" -R "${{ github.repository }}" -n secondlook-android -D apk
          ls -l apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator (Pixel 6, Android 14, Google APIs)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tools/android-e2e/run.py "$(ls apk/*.apk | head -1)" e2e-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results
          path: e2e-out
