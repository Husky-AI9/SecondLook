name: Install dependencies
description: Node 22 and npm packages. Uses the lockfile when there is one; otherwise resolves versions through Expo.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - shell: bash
      run: |
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund || npm run setup:deps
        fi
